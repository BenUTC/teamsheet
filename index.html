<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Teamsheet: football match predictions</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #14213D;        /* programme navy */
  --ink-2: #4A5875;
  --paper: #F3F6F4;      /* chalk-line white with a cool grass tint */
  --sheet: #FFFFFF;
  --line: #D3DBD6;
  --pitch: #1F7A4D;      /* best bets, positive */
  --pitch-2: #DCEFE4;
  --yellow: #F2C230;     /* card yellow: longshots, cautions */
  --yellow-2: #FBF0C7;
  --red: #D8343F;        /* card red: out, errors */
  --red-2: #F8DCDE;
  --display: 'Barlow Semi Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(68px + var(--safe-bottom)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.num, .prob, td, th { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; margin: 0; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
a { color: var(--pitch); }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--ink); color: #fff; padding: calc(10px + var(--safe-top)) 16px 10px; display: flex; align-items: center; gap: 12px; }
.top h1 { font-size: 1.45rem; flex: 1; }
.top .plan { font-size: 0.8rem; opacity: 0.85; text-align: right; }
.top .back { background: none; border: 0; color: #fff; font-size: 1.5rem; padding: 0 6px 0 0; line-height: 1; }
.demo-band { background: var(--yellow); color: var(--ink); font-size: 0.85rem; padding: 6px 16px; }

/* bottom tabs */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; background: var(--sheet); border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
nav.tabs a { flex: 1; text-align: center; padding: 10px 0 12px; text-decoration: none; color: var(--ink-2); font-family: var(--display); font-weight: 600; font-size: 1.02rem; border-top: 3px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-top-color: var(--pitch); }

main { max-width: 760px; margin: 0 auto; padding: 12px 12px 24px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.btn { background: var(--ink); color: #fff; border: 0; border-radius: 8px; padding: 11px 16px; font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.btn.secondary { background: var(--sheet); color: var(--ink); border: 1.5px solid var(--ink); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.5; }
input[type=text], input[type=password], input[type=date], input[type=number], select { width: 100%; padding: 10px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
label.field { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 0.92rem; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 7px 13px; font-size: 0.92rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.seg button { flex: 1; background: var(--sheet); border: 0; padding: 9px 4px; font-family: var(--display); font-weight: 600; font-size: 0.98rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* fixtures list */
.day-head { font-family: var(--display); font-weight: 600; color: var(--ink-2); margin: 14px 2px 6px; }
.fx { display: flex; width: 100%; text-align: left; align-items: center; gap: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.fx .ko { font-family: var(--display); font-weight: 700; font-size: 1.15rem; width: 48px; }
.fx .teams { flex: 1; min-width: 0; }
.fx .teams div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx .tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--pitch-2); color: var(--pitch); font-weight: 600; }
.crest { width: 22px; height: 22px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 0.62rem; font-weight: 700; color: #fff; background: var(--ink-2); vertical-align: middle; object-fit: contain; }
img.crest { background: transparent; }

/* match header: the team sheet */
.sheet-head { background: var(--ink); color: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.sheet-head .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.sheet-head .side { font-family: var(--display); font-size: 1.35rem; font-weight: 700; line-height: 1.15; }
.sheet-head .side.away { text-align: right; }
.sheet-head .mid { text-align: center; font-family: var(--display); }
.sheet-head .mid .big { font-size: 1.6rem; font-weight: 700; }
.sheet-head .meta { margin-top: 10px; font-size: 0.85rem; opacity: 0.9; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.badge { display: inline-block; font-size: 0.8rem; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
.badge.ok { background: var(--pitch); color: #fff; }
.badge.warn { background: var(--yellow); color: var(--ink); }
.badge.bad { background: var(--red); color: #fff; }
.subtabs { position: sticky; top: calc(52px + var(--safe-top)); z-index: 10; background: var(--paper); padding: 6px 0; }

/* selections with the pitch-strip probability bar */
.pick { padding: 11px 0 12px; border-bottom: 1px solid var(--line); }
.pick:last-child { border-bottom: 0; }
.pick .top-line { display: flex; gap: 10px; align-items: baseline; }
.pick .lbl { flex: 1; min-width: 0; font-weight: 600; }
.pick .prob { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1; }
.pick .sub { font-size: 0.82rem; color: var(--ink-2); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.strip { position: relative; height: 10px; margin-top: 8px; border-radius: 2px; background: repeating-linear-gradient(90deg, #E6EEE9 0 10%, #EEF4F0 10% 20%); overflow: hidden; }
.strip .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pitch); }
.strip.long .fill { background: var(--yellow); }
.strip .half { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; }
.strip .box { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.55; }
.value { font-weight: 700; color: var(--pitch); }
.novalue { color: var(--ink-2); }
.res-won { color: var(--pitch); font-weight: 700; }
.res-lost { color: var(--red); font-weight: 700; }
.lucky-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--ink); }
.lucky-total .prob { font-family: var(--display); font-weight: 700; font-size: 1.8rem; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { text-align: right; font-weight: 600; color: var(--ink-2); padding: 6px 5px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
td { text-align: right; padding: 6px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tr.dim td { color: var(--ink-2); }
.w { color: var(--pitch); font-weight: 700; } .l { } .d { color: var(--ink-2); font-weight: 700; }
td.res-W { color: var(--pitch); font-weight: 700; } td.res-L { color: var(--red); font-weight: 700; } td.res-D { color: var(--ink-2); font-weight: 700; }
.hits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hit { font-size: 0.8rem; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
.hit b { font-family: var(--display); font-size: 0.95rem; }

/* players */
.pl { border-bottom: 1px solid var(--line); }
.pl > button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; }
.pl .name { font-weight: 600; }
.pos { display: inline-block; width: 22px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 0.85rem; border-radius: 4px; background: var(--paper); border: 1px solid var(--line); margin-right: 6px; }
.st { font-size: 0.78rem; font-weight: 600; }
.st.start { color: var(--pitch); } .st.bench { color: var(--ink-2); } .st.out { color: var(--red); } .st.doubt { color: #9A7400; } .st.predicted { color: var(--ink-2); }
.pchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.pchip { font-size: 0.78rem; padding: 2px 6px; border-radius: 5px; background: var(--paper); border: 1px solid var(--line); }
.pchip.hi { background: var(--pitch-2); border-color: #B9DCC7; }
.pchip.mid { background: var(--yellow-2); border-color: #EBD98F; }
.pl .more { padding: 0 0 12px; }

.kv { display: grid; grid-template-columns: 1fr auto auto auto; gap: 4px 12px; font-size: 0.9rem; }
.kv .h { color: var(--ink-2); font-weight: 600; text-align: right; }
.kv .r { text-align: right; font-variant-numeric: tabular-nums; }
.bar1x2 { display: flex; height: 28px; border-radius: 6px; overflow: hidden; font-family: var(--display); font-weight: 700; font-size: 0.95rem; }
.bar1x2 div { display: grid; place-items: center; color: #fff; min-width: 34px; }
.bar1x2 .h { background: var(--ink); } .bar1x2 .d { background: #8C97A8; } .bar1x2 .a { background: var(--pitch); }

.progress { padding: 26px 12px; text-align: center; }
.progress .msg { margin-top: 12px; color: var(--ink-2); }
.ball { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--ink); border-top-color: var(--pitch); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ball { animation-duration: 3s; } }
.error { background: var(--red-2); border: 1px solid var(--red); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.note { background: var(--yellow-2); border-left: 4px solid var(--yellow); padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.9rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + var(--safe-bottom)); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; z-index: 50; font-size: 0.92rem; }
.empty { text-align: center; padding: 26px 10px; color: var(--ink-2); }
.toggle { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.toggle input { flex: none; width: 20px; height: 20px; accent-color: var(--pitch); }
.league-list label { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.league-list input { width: 19px; height: 19px; accent-color: var(--pitch); }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.footer-note { font-size: 0.8rem; color: var(--ink-2); text-align: center; margin: 18px 8px 0; }

/* odds, add buttons, bet builder, live */
.odds { font-family: var(--display); font-weight: 700; color: var(--ink); }
.odds.fair { color: var(--ink-2); }
.addbtn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--pitch); background: var(--sheet); color: var(--pitch); font-size: 1.15rem; font-weight: 700; line-height: 1; display: inline-grid; place-items: center; padding: 0; }
.addbtn.on { background: var(--pitch); color: #fff; }
td .addbtn { width: 28px; height: 28px; font-size: 1rem; vertical-align: middle; margin-left: 4px; }
.cellp { font-weight: 600; }
button.pchip { font: inherit; font-size: 0.78rem; color: var(--ink); cursor: pointer; }
.pchip.sel { outline: 2px solid var(--pitch); background: var(--pitch-2); }
.slipbar { position: fixed; left: 10px; right: 10px; bottom: calc(64px + var(--safe-bottom)); z-index: 25; display: flex; justify-content: space-between; gap: 10px; background: var(--pitch); color: #fff; border: 0; border-radius: 10px; padding: 12px 14px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; box-shadow: 0 2px 10px rgba(20,33,61,0.25); }
main { padding-bottom: 70px; }
.oddsin { width: 110px !important; text-align: center; }
.tag.live { background: var(--red); color: #fff; }
.tag.ft { background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); }
.fx .teams div { display: flex; align-items: center; gap: 6px; }
.fx .sc { margin-left: auto; font-family: var(--display); font-size: 1.15rem; padding-left: 8px; }
.fx.is-live { border-color: var(--red); }
.cardy, .cardr { display: inline-block; width: 10px; height: 14px; border-radius: 2px; vertical-align: -2px; }
.cardy { background: var(--yellow); } .cardr { background: var(--red); }
tr.nob td { border-bottom: 1px solid var(--line); padding-top: 0; white-space: normal; }
table.live-pl td:first-child { white-space: normal; min-width: 120px; }

/* bet tracker */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 6px; }
.kpis div { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; }
.kpis b { font-family: var(--display); font-size: 1.4rem; }
.betleg { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
.bet.won { border-left: 4px solid var(--pitch); } .bet.lost { border-left: 4px solid var(--red); } .bet.open, .bet.check { border-left: 4px solid var(--yellow); }
</style>

<body>
<div id="app"></div>
<script>
window.TEAMSHEET_VERSION='202611222011';
/* ===== stats.js ===== */
/* Probability engine: count distributions, joint team-stat model, Dixon-Coles score matrix. */
(function (root) {
  'use strict';
  const FP = (root.FP = root.FP || {});

  const LANCZOS = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
    12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

  function lgamma(x) {
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    x -= 1;
    let a = 0.99999999999980993;
    const t = x + 7.5;
    for (let i = 0; i < 8; i++) a += LANCZOS[i] / (x + i + 1);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }

  // Regularised lower incomplete gamma P(a, x)
  function gammaP(a, x) {
    if (x <= 0) return 0;
    if (x < a + 1) {
      let sum = 1 / a, term = sum, ap = a;
      for (let n = 0; n < 500; n++) {
        ap += 1; term *= x / ap; sum += term;
        if (Math.abs(term) < Math.abs(sum) * 1e-14) break;
      }
      return Math.min(1, sum * Math.exp(-x + a * Math.log(x) - lgamma(a)));
    }
    // continued fraction for Q
    let b = x + 1 - a, c = 1e300, d = 1 / b, h = d;
    for (let i = 1; i < 500; i++) {
      const an = -i * (i - a);
      b += 2;
      d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300;
      c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300;
      d = 1 / d;
      const del = d * c; h *= del;
      if (Math.abs(del - 1) < 1e-14) break;
    }
    const q = Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
    return Math.max(0, 1 - q);
  }

  function gammaInvP(a, p) {
    // inverse of P(a, x) by bisection on log scale (robust, adequate speed for small n)
    if (p <= 0) return 0;
    if (p >= 1) return Infinity;
    let lo = 0, hi = Math.max(1, a);
    while (gammaP(a, hi) < p) hi *= 2;
    for (let i = 0; i < 80; i++) {
      const mid = 0.5 * (lo + hi);
      if (gammaP(a, mid) < p) lo = mid; else hi = mid;
      if (hi - lo < 1e-10 * hi) break;
    }
    return 0.5 * (lo + hi);
  }

  const _shockCache = new Map();
  // Discretise Z ~ Gamma(shape s, mean 1) into n equal-probability points (conditional means).
  function shockPoints(s, n) {
    n = n || 24;
    if (!isFinite(s) || s > 5000) return { z: [1], w: [1] };
    const key = s.toFixed(4) + ':' + n;
    if (_shockCache.has(key)) return _shockCache.get(key);
    const z = [], w = [];
    let prevX = 0, prevP1 = 0;
    for (let i = 1; i <= n; i++) {
      const x = i === n ? Infinity : gammaInvP(s, i / n); // in rate-1 units for shape s
      const p1 = i === n ? 1 : gammaP(s + 1, x);
      // E[Z; bin] with Z = X/s, X~Gamma(s,1): (s/s) * (P(s+1,x_i) - P(s+1,x_{i-1}))
      const mass = p1 - prevP1;
      z.push(mass * n); w.push(1 / n);
      prevX = x; prevP1 = p1;
    }
    const out = { z, w };
    _shockCache.set(key, out);
    return out;
  }


  // Inverse standard normal CDF (Acklam's algorithm, |rel err| < 1.2e-9)
  function invNorm(p) {
    const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
    const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
    const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
    const pl = 0.02425;
    if (p < pl) { const q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    if (p > 1 - pl) { const q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    const q = p - 0.5, r = q * q;
    return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
  }
  let _normPts = null;
  function normalPoints() {
    if (_normPts) return _normPts;
    const n = 24, x = [];
    for (let i = 0; i < n; i++) x.push(invNorm((i + 0.5) / n));
    const v = x.reduce((a, b) => a + b * b, 0) / n, sd = Math.sqrt(v);
    _normPts = x.map((t) => t / sd); // exactly unit variance
    return _normPts;
  }

  /* Count pmf with mean mu and extra-variance coefficient u: Var = mu + u*mu^2.
     u > 0: negative binomial; u < 0: binomial (under-dispersed); u ~ 0: Poisson. */
  function countPmf(mu, u, maxK) {
    if (u > 1e-4) return nbPmf(mu, 1 / u, maxK);
    if (u < -1e-4 && mu > 0) {
      let n = Math.round(-1 / u);
      if (mu > 0.9 * n) n = Math.ceil(mu / 0.9);
      const p = mu / n, K = maxK == null ? n : maxK;
      const out = new Array(K + 1).fill(0);
      const lq = Math.log(1 - p), lp = Math.log(p);
      for (let k = 0; k <= Math.min(n, K); k++) out[k] = Math.exp(lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1) + k * lp + (n - k) * lq);
      return out;
    }
    return poissonPmf(mu, maxK);
  }

  /* Flexible joint for a (home, away) count pair matching two moment targets measured out of sample:
       cm = marginal extra variance coefficient  (Var(Y) = l + cm*l^2)
       cc = covariance coefficient               (Cov(H,A) = cc*lh*la), may be negative.
     Built from a shared log-normal multiplier, perfectly correlated (cc>0) or anti-correlated (cc<0)
     between the sides, plus independent NB/binomial noise for the remaining marginal variance. */
  function jointFlex(lh, la, cm, cc, maxK) {
    let sig2 = 0, sign = 1;
    if (cc > 1e-4) { sig2 = Math.log(1 + cc); sign = 1; }

      const basic = j.response.map(D.normFixture).filter(D.isFinished);
      const det = await getDetails(basic.map((f) => f.id));
      return basic.map((f) => det.get(f.id) || f).sort((a, b) => b.ts - a.ts);
    }

    async function headToHead(a, b) {
      const j = await client.get('fixtures/headtohead', { h2h: `${a}-${b}`, last: 10, timezone: settings.tz }, H3);
      const basic = j.response.map(D.normFixture).filter(D.isFinished);
      const det = await getDetails(basic.map((f) => f.id));
      return basic.map((f) => det.get(f.id) || f).sort((x, y) => y.ts - x.ts);
    }

    async function safe(p, fallback, note, notes) {
      try { return await p; } catch (e) { if (notes) notes.push(`${note}: ${e.message}`); log(note + ': ' + e.message); return fallback; }
    }

    /* ---------- modelling ---------- */
    function fitAll(pool, refTs, key) {
      if (key && memo.has('fit:' + key)) return memo.get('fit:' + key);
      const out = {};
      for (const st of STATS) out[st] = M.fitTeamModel(pool, st, { refTs });
      if (key) memo.set('fit:' + key, out);
      return out;
    }

    function jointFor(stat, model, lh, la) {
      if (stat === 'goals') return S.dcMatrix(lh, la, M.DEFAULTS.rho, 10);
      return S.jointFlex(lh, la, model.cm, model.cc);
    }

    /* De-margined match-result and over/under probabilities from normalised odds (median across bookmakers). */
    function marketTarget(odds) {
      if (!odds) return null;
      const med = (a) => { const b = a.slice().sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };
      const price = (bet, value) => { for (const [, b] of odds.bets) if (bet.test(b.bet) && b.value.toLowerCase() === value.toLowerCase()) return med(b.prices.map((x) => x.odd)); return null; };
      const t = {};
      const H = price(/^match winner$/i, 'Home'), Dr = price(/^match winner$/i, 'Draw'), A = price(/^match winner$/i, 'Away');
      if (H && Dr && A) { const s = 1 / H + 1 / Dr + 1 / A; t.h = 1 / H / s; t.d = 1 / Dr / s; t.a = 1 / A / s; }
      for (const l of [2.5, 1.5, 3.5, 2, 3, 2.75, 2.25]) {
        const o = price(/^goals over\/under$/i, `Over ${l}`), u = price(/^goals over\/under$/i, `Under ${l}`);
        if (o && u && Number.isInteger(l + 0.5)) { const s = 1 / o + 1 / u; t.over = 1 / o / s; t.ouLine = l; break; }
      }
      return t.h != null || t.over != null ? t : null;
    }

    function teamPredictions(fx, models, pool, refTs, neutral, odds) {
      const team = {}, factors = {};
      const mkt = settings.marketWeight > 0 ? marketTarget(odds) : null;
      for (const st of STATS) {
        const m = models[st];
        let { lh, la } = M.predictRaw(m, fx.home.id, fx.away.id, fx.comp, neutral);
        const fac = { referee: null, h2h: null };
        if (st === 'goals' && mkt) {
          // bookmakers know more about goals and results than any model built on public stats (tested on 2025/26),
          // so goal expectations lean on the prices when they exist
          const g = M.marketGoals(mkt, lh, la);
          const w = settings.marketWeight;
          fac.market = { modelLh: lh, modelLa: la, marketLh: g.lh, marketLa: g.la, weight: w };
          lh = Math.exp(w * Math.log(g.lh) + (1 - w) * Math.log(lh));
          la = Math.exp(w * Math.log(g.la) + (1 - w) * Math.log(la));
        }
        if ((st === 'cards' || st === 'fouls') && fx.referee) {
          const rf = M.refereeFactor(m, pool, st, fx.referee, refTs);
          if (rf.n > 0) { lh *= rf.factor; la *= rf.factor; fac.referee = rf; }
        }
        if (st === 'cards' || st === 'fouls' || st === 'corners') {
          const hf = M.h2hFactor(m, pool, st, fx.home.id, fx.away.id, refTs);
          if (hf.n > 0) { lh *= hf.factor; la *= hf.factor; fac.h2h = hf; }
        }
        const J = jointFor(st, m, lh, la);
        const sm = S.summarise(J);
        const t = { lh, la, joint: J, total: sm.total, home: sm.home, away: sm.away, homeMore: sm.homeMore, awayMore: sm.awayMore, equal: sm.equal, n: m.n };
        if (st === 'goals') {
          t.oneXtwo = { h: sm.homeMore, d: sm.equal, a: sm.awayMore };
          t.btts = S.bothAtLeast(J, 1);
          const scores = [];
          for (let i = 0; i <= 6; i++) for (let j = 0; j <= 6; j++) scores.push({ s: `${i}-${j}`, p: J[i][j] });
          t.topScores = scores.sort((a, b) => b.p - a.p).slice(0, 6);
        }
        team[st] = t; factors[st] = fac;
      }
      return { team, factors };
    }

    /* Squad for one side: confirmed line-up, or predicted from recent matches and injuries. */
    function buildSquad(fx, side, apps, teamFixtures, injuries, refTs) {
      const teamId = fx[side].id;
      const lu = fx.lineups && fx.lineups[teamId];
      const confirmed = !!(fx.lineups && fx.lineups[fx.home.id] && fx.lineups[fx.away.id]);
      const list = [];
      if (confirmed) {
        for (const x of lu.xi) list.push({ id: x.id, name: x.name, number: x.number, lpos: x.pos, status: 'start' });
        for (const x of lu.subs) list.push({ id: x.id, name: x.name, number: x.number, lpos: x.pos, status: 'bench' });
        return { confirmed, list, formation: lu.formation, coach: lu.coach };
      }
      const recent = teamFixtures.slice(0, 6);
      const ids = recent.map((f) => f.id);
      const seen = new Map();
      for (const f of recent) for (const p of f.players || []) {
        if (p.team !== teamId || (!p.min && !p.bench)) continue;
        if (!seen.has(p.id)) seen.set(p.id, { id: p.id, name: p.name, number: p.number, lpos: p.pos });
      }
      for (const [pid, info] of seen) {
        const a = apps.get(pid) || [];
        // moved to another team since?
        if (a.length && a[0].team !== teamId) continue;
        const av = P.availability(a, ids);
        const inj = injuries && injuries.get(pid);
        let status = 'predicted', pStart = av.pStart, pSub = av.pSub;
        if (inj && inj.status === 'out') { status = 'out'; pStart = 0; pSub = 0; }
        else if (inj && inj.status === 'doubt') { status = 'doubt'; pStart *= 0.5; pSub *= 0.5; }
        list.push(Object.assign(info, { status, pStart, pSub, pOnFromBench: av.pOnFromBench, injury: inj || null }));
      }
      // injured players who have not featured recently still deserve a mention
      if (injuries) for (const [pid, inj] of injuries) if (inj.team === teamId && !seen.has(pid)) list.push({ id: pid, name: inj.name, status: inj.status === 'out' ? 'out' : 'doubt', pStart: 0, pSub: 0, injury: inj, notRecent: true });
      // rescale so expected starters are 1 goalkeeper and 10 outfielders
      const isGK = (x) => P.normPos(x.lpos || P.mainPos(apps.get(x.id) || [])) === 'G' || (apps.get(x.id) && P.mainPos(apps.get(x.id)) === 'G');
      for (const [want, filter] of [[1, (x) => isGK(x)], [10, (x) => !isGK(x)]]) {
        const grp = list.filter((x) => filter(x) && x.pStart > 0);
        for (let it = 0; it < 20; it++) {
          const sum = grp.reduce((a, x) => a + x.pStart, 0);
          if (sum <= 0 || Math.abs(sum - want) < 0.01) break;
          const f = want / sum;
          for (const x of grp) x.pStart = Math.min(0.95, x.pStart * f);
        }
        for (const x of grp) x.pSub = Math.min(x.pSub, Math.max(0, 1 - x.pStart));
      }
      return { confirmed, list };
    }

    function playerPredictions(fx, side, squad, apps, priors, models, team, refTs) {
      const isHome = side === 'home';
      const teamId = fx[side].id;
      const comp = fx.comp;
      const facFor = (st) => {
        const lam = isHome ? team[st].lh : team[st].la;
        const base = M.teamBaseline(models[st], teamId, comp, isHome);
        return S.clamp(lam / base.for, 0.5, 1.8);
      };
      const facAgainst = (st) => {
        const lam = isHome ? team[st].la : team[st].lh;
        const base = M.teamBaseline(models[st], teamId, comp, isHome);
        return S.clamp(lam / base.against, 0.5, 1.8);
      };
      const factors = { fc: facFor('fouls'), fd: facAgainst('fouls'), shots: facFor('shots'), sot: facFor('sot'), goals: facFor('goals'), card: facFor('cards') };
      const savesMarg = isHome ? team.saves.home : team.saves.away;
      const out = [];
      for (const s of squad.list) {
        const a = apps.get(s.id) || [];
        const pos = a.length ? P.mainPos(a) : P.normPos(s.lpos);
        let sc;
        if (s.status === 'start') sc = P.minutesScenarios(a, { status: 'start' });
        else if (s.status === 'bench') sc = P.minutesScenarios(a, { status: 'bench', pOnFromBench: benchProb(a) });
        else if (s.status === 'out') sc = [{ w: 1, min: 0 }];
        else sc = P.minutesScenarios(a, { status: 'predicted', pStart: s.pStart, pSub: s.pSub });
        const pPlay = sc.reduce((x, c) => x + (c.min > 0 ? c.w : 0), 0);
        const expMin = sc.reduce((x, c) => x + c.w * c.min, 0);
        const pred = {};
        for (const st of ['fc', 'fd', 'shots', 'sot', 'goals']) {
          const r = P.playerRate(a, st, priors, refTs, { pos });
          const pmf = P.playerStatPmf(r.rate, sc, factors[st], P.DEFAULTS.dispersion[st]);
          pred[st] = { rate90: r.rate, raw90: r.raw90, n90: r.n90, mean: S.mean(pmf), pmf, p1: S.atLeast(pmf, 1), p2: S.atLeast(pmf, 2), p3: S.atLeast(pmf, 3), p4: S.atLeast(pmf, 4), factor: factors[st] };
        }
        const rc = P.playerRate(a, 'card', priors, refTs, { pos });
        pred.card = { rate90: rc.rate, p: P.cardProb(rc.rate, sc, factors.card), factor: factors.card };
        if (pos === 'G') {
          const pStartGK = sc.reduce((x, c) => x + (c.min >= 45 ? c.w : 0), 0);
          const pmf = S.mixture([{ w: pStartGK, pmf: savesMarg }, { w: 1 - pStartGK, pmf: [1] }]);
          pred.saves = { mean: S.mean(pmf), pmf, p1: S.atLeast(pmf, 1), p2: S.atLeast(pmf, 2), p3: S.atLeast(pmf, 3), p4: S.atLeast(pmf, 4) };
        }
        out.push(Object.assign({}, s, { pos, pPlay, expMin, pred, apps: a.length }));
      }
      const order = { start: 0, predicted: 1, doubt: 2, bench: 3, out: 4 };
      out.sort((x, y) => (order[x.status] - order[y.status]) || (y.pPlay - x.pPlay) || ('GDMF'.indexOf(x.pos) - 'GDMF'.indexOf(y.pos)));
      return out;
    }
    /* With confirmed line-ups and detailed positions, nudge fouls committed and fouls drawn by the direct opponent's
       habits (a full-back facing a winger who draws lots of fouls). Small by design: testing showed only a slight gain. */
    function applyMatchups(fx, players, apps, priors, refTs) {
      const lu = fx.lineups;
      if (!lu || !lu[fx.home.id] || !lu[fx.away.id]) return;
      const det = new Map();
      for (const tid of [fx.home.id, fx.away.id]) for (const x of lu[tid].xi) det.set(x.id, { zone: P.zoneOf(x.detail), detail: x.detail, team: tid });
      if (![...det.values()].some((d) => d.zone)) return;
      const rel = (pid, stat, pos) => { const a = apps.get(pid) || []; const r = P.playerRate(a, stat, priors, refTs, { pos }); return r.rate / Math.max(priors[stat][r.pos].mean, 1e-6); };
      for (const side of ['home', 'away']) {
        const oppSide = side === 'home' ? 'away' : 'home';
        const opps = players[oppSide].filter((p) => p.status === 'start' && det.get(p.id)).map((p) => ({ p, zone: det.get(p.id).zone }));
        for (const pl of players[side]) {
          const d = det.get(pl.id);
          if (!d || !d.zone || pl.pos === 'G' || pl.status !== 'start') continue;
          const dos = P.directOpponents(d.zone, opps);
          if (!dos.length) continue;
          let w = 0, lfd = 0, lfc = 0;
          for (const { o, w: ww } of dos) { w += ww; lfd += ww * Math.log(rel(o.p.id, 'fd', o.p.pos)); lfc += ww * Math.log(rel(o.p.id, 'fc', o.p.pos)); }
          const gFd = Math.exp(lfd / w), gFc = Math.exp(lfc / w);
          const adj = { fc: Math.pow(gFd, P.MATCHUP_BETA), fd: Math.pow(gFc, P.MATCHUP_BETA) };
          const a = apps.get(pl.id) || [];
          const sc = P.minutesScenarios(a, { status: 'start' });
          for (const st of ['fc', 'fd']) {
            const pr = pl.pred[st];
            pr.factor = pr.factor * adj[st];
            const pmf = P.playerStatPmf(pr.rate90, sc, pr.factor, P.DEFAULTS.dispersion[st]);
            Object.assign(pr, { pmf, mean: S.mean(pmf), p1: S.atLeast(pmf, 1), p2: S.atLeast(pmf, 2), p3: S.atLeast(pmf, 3), p4: S.atLeast(pmf, 4) });
          }
          const main = dos.slice().sort((x, y) => y.w - x.w)[0].o.p;
          pl.matchup = { opponent: main.name, oppFd: gFd, oppFc: gFc, adjFc: adj.fc, adjFd: adj.fd };
        }
      }
    }
    function benchProb(apps) {
      let b = 0, on = 0;
      for (const a of apps.slice(0, 15)) if (!a.start && (a.bench || a.min > 0)) { b++; if (a.min > 0) on++; }
      return (on + 1) / (b + 2.2);
    }

    /* ---------- tables for display ---------- */
    function teamRow(f, teamId) {
      const home = f.home.id === teamId;
      const s = home ? 'h' : 'a', o = home ? 'a' : 'h';
      const g = f.goals || { h: null, a: null };
      const gf = home ? g.h : g.a, ga = home ? g.a : g.h;
      const st = f.st || {};
      const v = (side, k) => (st[side] && st[side][k] != null ? st[side][k] : null);
      return {
        id: f.id, ts: f.ts, comp: f.compName, opp: home ? f.away.name : f.home.name, venue: home ? 'H' : 'A',
        gf, ga, res: gf == null ? '' : gf > ga ? 'W' : gf < ga ? 'L' : 'D',
        cornersF: v(s, 'corners'), cornersA: v(o, 'corners'), cardsF: v(s, 'cards'), cardsA: v(o, 'cards'),
        shotsF: v(s, 'shots'), sotF: v(s, 'sot'), sotA: v(o, 'sot'), foulsF: v(s, 'fouls'), foulsA: v(o, 'fouls'), saves: v(s, 'saves'), xgF: v(s, 'xg'),
        btts: gf != null ? gf > 0 && ga > 0 : null, referee: f.referee,
      };
    }
    function hitRates(rows) {
      const n = (fn) => { let c = 0, t = 0; for (const r of rows) { const x = fn(r); if (x == null) continue; t++; if (x) c++; } return { c, t }; };
      const tot = (a, b) => (a == null || b == null ? null : a + b);
      return {
        played: rows.length,
        won: n((r) => r.res === 'W'), btts: n((r) => r.btts), o15: n((r) => tot(r.gf, r.ga) == null ? null : r.gf + r.ga > 1.5), o25: n((r) => tot(r.gf, r.ga) == null ? null : r.gf + r.ga > 2.5),
        scored: n((r) => r.gf == null ? null : r.gf > 0), cleanSheet: n((r) => r.ga == null ? null : r.ga === 0),
        cards1: n((r) => r.cardsF == null ? null : r.cardsF >= 1), cards2: n((r) => r.cardsF == null ? null : r.cardsF >= 2), cards3: n((r) => r.cardsF == null ? null : r.cardsF >= 3),
        bothCards1: n((r) => r.cardsF == null || r.cardsA == null ? null : r.cardsF >= 1 && r.cardsA >= 1),
        bothCards2: n((r) => r.cardsF == null || r.cardsA == null ? null : r.cardsF >= 2 && r.cardsA >= 2),
        bothCards3: n((r) => r.cardsF == null || r.cardsA == null ? null : r.cardsF >= 3 && r.cardsA >= 3),
        cardsO35: n((r) => tot(r.cardsF, r.cardsA) == null ? null : r.cardsF + r.cardsA > 3.5),
        cornersO95: n((r) => tot(r.cornersF, r.cornersA) == null ? null : r.cornersF + r.cornersA > 9.5),
        teamCornersO45: n((r) => r.cornersF == null ? null : r.cornersF > 4.5),
        saves3: n((r) => r.saves == null ? null : r.saves >= 3),
        avg: avgOf(rows),
      };
    }
    function avgOf(rows) {
      const keys = ['gf', 'ga', 'cornersF', 'cornersA', 'cardsF', 'cardsA', 'shotsF', 'sotF', 'sotA', 'foulsF', 'foulsA', 'saves', 'xgF'];
      const out = {};
      for (const k of keys) { const v = rows.map((r) => r[k]).filter((x) => x != null); out[k] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
      return out;
    }
    function playerLog(pid, teamFixtures) {
      const rows = [];
      for (const f of teamFixtures.slice(0, 10)) {
        const p = (f.players || []).find((x) => x.id === pid);
        const isHome = p ? p.team === f.home.id : null;
        const row = { id: f.id, ts: f.ts, opp: isHome == null ? '' : isHome ? f.away.name : f.home.name, venue: isHome == null ? '' : isHome ? 'H' : 'A', comp: f.compName, hasData: !!f.players };
        if (!f.players) row.status = 'no data';
        else if (!p) row.status = 'not in squad';
        else if (!p.min) row.status = 'unused sub';
        else Object.assign(row, { status: p.start ? 'started' : 'sub', min: p.min, fc: p.fc, fd: p.fd, shots: p.shots, sot: p.sot, goals: p.goals, yc: p.yc, rc: p.rc, saves: p.saves, rating: p.rating });
        rows.push(row);
      }
      const played = rows.filter((r) => r.min > 0);
      const hits = {};
      for (const [k, lines] of Object.entries({ fc: [1, 2, 3], fd: [1, 2, 3], shots: [1, 2, 3], sot: [1, 2], goals: [1], saves: [2, 3, 4] })) {
        hits[k] = lines.map((l) => ({ l, c: played.filter((r) => r[k] >= l).length, t: played.length }));
      }
      hits.card = [{ l: 1, c: played.filter((r) => r.yc > 0 || r.rc > 0).length, t: played.length }];
      const mins = played.reduce((a, r) => a + r.min, 0);
      const per90 = {};
      for (const k of ['fc', 'fd', 'shots', 'sot', 'goals', 'saves']) per90[k] = mins > 0 ? played.reduce((a, r) => a + (r[k] || 0), 0) / mins * 90 : null;
      return { rows, hits, per90, played: played.length, mins };
    }

    /* ---------- odds ---------- */
    async function oddsForFixture(fid, notes) {
      const j = await safe(client.get('odds', { fixture: fid }, 30 * MIN), null, 'Odds unavailable', notes);
      if (!j || !j.response || !j.response.length) return null;
      return D.normOdds(j.response[0]);
    }

    /* ---------- match analysis ---------- */
    async function analyseFixture(fid, progress) {
      const notes = [];
      const step = (msg) => { if (progress) progress(msg); };
      step('Loading match');
      const baseJ = await client.get('fixtures', { id: fid, timezone: settings.tz }, 5 * MIN);
      if (!baseJ.response.length) throw new FP.api.ApiError('api', 'Match not found');
      const fx = D.normFixture(baseJ.response[0]);
      return analyse(fx, notes, step);
    }

    async function analyseTeams(leagueId, homeId, awayId, progress) {
      const step = (msg) => { if (progress) progress(msg); };
      step('Looking for the next meeting');
      const j = await client.get('fixtures/headtohead', { h2h: `${homeId}-${awayId}`, next: 1, timezone: settings.tz }, H3);
      const next = j.response.map(D.normFixture).find((f) => !D.isFinished(f));
      if (next && next.home.id === homeId) return analyseFixture(next.id, progress);
      const info = await leagueInfo(leagueId);
      const teamsJ = await client.get('teams', { league: leagueId, season: info.season }, DAY);
      const tname = (id) => { const t = teamsJ.response.find((x) => x.team.id === id); return t ? t.team : { id, name: String(id), logo: null }; };
      const fx = { id: `hypo-${homeId}-${awayId}`, ts: Date.now() + DAY, date: new Date(Date.now() + DAY).toISOString(), comp: leagueId, compName: info.name, season: info.season, round: 'Hypothetical', referee: null, status: 'NS', home: tname(homeId), away: tname(awayId), goals: null, st: null, players: null, lineups: null, hypothetical: true };
      const notes = [next ? `These teams next meet with ${next.home.name} at home (${new Date(next.ts).toDateString()}). This is a hypothetical match with ${fx.home.name} at home.` : 'No scheduled meeting found, so this is a hypothetical match.'];
      return analyse(fx, notes, step);
    }

    async function analyse(fx, notes, step) {
      const refTs = D.isFinished(fx) || D.isLive(fx) ? fx.ts : Math.max(Date.now(), Math.min(fx.ts, Date.now()));
      const info = await leagueInfo(fx.comp).catch(() => ({ id: fx.comp, name: fx.compName, type: 'League', season: fx.season, coverage: {} }));
      if (info.coverage && info.coverage.fixtures && info.coverage.fixtures.statistics_players === false) notes.push(`API-Football does not provide player statistics for ${info.name}, so player predictions rely on position averages.`);
      step('Loading league data');
      const pool = [];
      const addAll = (arr) => { for (const f of arr) pool.push(f); };
      const cur = await leagueSeason(fx.comp, fx.season, (d, t) => step(`Downloading match stats ${d}/${t}`));
      addAll(cur.fixtures);
      if (settings.includePrevSeason) {
        const prev = await safe(leagueSeason(fx.comp, fx.season - 1, (d, t) => step(`Downloading last season ${d}/${t}`)), null, 'Last season unavailable', notes);
        if (prev) addAll(prev.fixtures);
      }
      step('Loading team form');
      const [homeRecent, awayRecent, h2h] = await Promise.all([teamRecent(fx.home.id, 10), teamRecent(fx.away.id, 10), safe(headToHead(fx.home.id, fx.away.id), [], 'Head-to-head unavailable', notes)]);
      // Cups: add each team's domestic league so strengths are linked across competitions
      if (info.type === 'Cup') {
        const domestic = new Set();
        for (const f of homeRecent.concat(awayRecent)) if (f.comp !== fx.comp) domestic.add(f.comp + '|' + f.season);
        for (const key of domestic) {
          const [lid, s] = key.split('|').map(Number);
          const li = await safe(leagueInfo(lid), null);
          if (!li || li.type !== 'League') continue;
          step(`Loading ${li.name}`);

    if (!D.isLive(L) && !D.isFinished(L)) return `<div class="empty">Kick-off at ${fmtTime(f.ts)}. Live stats appear here once the match starts and update every minute.</div>`;
    const min = liveMinute(L), rest = Math.max(0, 90 - min) / 90, done = D.isFinished(L);
    const st = L.st || { h: {}, a: {} };
    const row = (label, k, stat) => {
      const h = st.h[k], a = st.a[k];
      const t = stat && r.team[stat];
      const exp = t ? `<td class="muted">${f1(t.lh)}–${f1(t.la)}</td>` : '<td></td>';
      return `<tr><td class="l">${label}</td><td><b>${dash(h)}</b></td><td><b>${dash(a)}</b></td>${exp}</tr>`;
    };
    const table = `<div class="tbl-wrap"><table><thead><tr><th class="l"></th><th>${esc(f.home.name)}</th><th>${esc(f.away.name)}</th><th>Expected</th></tr></thead><tbody>
      ${row('Shots', 'shots', 'shots')}${row('Shots on target', 'sot', 'sot')}${row('Corners', 'corners', 'corners')}${row('Fouls', 'fouls', 'fouls')}
      ${row('Yellow cards', 'yellow')}${row('Red cards', 'red')}${row('Cards', 'cards', 'cards')}${row('Keeper saves', 'saves', 'saves')}${row('Possession %', 'poss')}${row('Offsides', 'offsides')}</tbody></table></div>`;
    // in-play chances for the next lines, using the pre-match rates for the minutes left
    let inplay = '';
    if (!done && rest * 90 >= 3) {
      const lines = [];
      for (const [stat, word] of [['corners', 'corners'], ['cards', 'cards'], ['sot', 'shots on target']]) {
        const t = r.team[stat], ch = st.h[stat] || 0, ca = st.a[stat] || 0, cur = ch + ca;
        const J = S.summarise(S.jointFlex(t.lh * rest, t.la * rest, stat === 'goals' ? 0 : (FP.models.DEFAULTS.dispersion[stat] || {}).cm || 0, (FP.models.DEFAULTS.dispersion[stat] || {}).cc || 0));
        for (let i = 0; i < 3; i++) {
          const line = cur + i + 0.5, need = i + 1;
          const p = S.atLeast(J.total, need);
          lines.push(`<tr><td class="l">Over ${line} ${word}</td><td>${pct(p)}</td><td><span class="odds fair">${esc(frac(fairDec(p)))}</span></td><td>${addBtn({ id: `${f.id}:live:${stat}:${line}`, label: `Over ${line} ${word} (in play, ${min}')`, match: `${f.home.name} v ${f.away.name}`, fixtureId: f.id, kickoff: f.ts, p, group: 'In play', family: `live-${stat}-o`, level: line, odds: '' })}</td></tr>`);
        }
      }
      inplay = `<div class="panel"><h3>In-play chances</h3><p class="small muted">What happens next, using each team's pre-match rates for the ${Math.round(rest * 90)} minutes left plus what has already happened.</p><div class="tbl-wrap"><table><thead><tr><th class="l">Line</th><th>Chance</th><th>Fair</th><th></th></tr></thead><tbody>${lines.join('')}</tbody></table></div></div>`;
    }
    const evs = (L.events || []).slice().sort((a, b) => (a.min || 0) - (b.min || 0) || (a.extra || 0) - (b.extra || 0));
    const evRow = (e) => {
      const side = e.team === f.home.id ? f.home.name : e.team === f.away.id ? f.away.name : '';
      const t = e.min != null ? `${e.min}${e.extra ? '+' + e.extra : ''}'` : '';
      let what;
      if (e.type === 'Goal') what = `<b>Goal</b> ${esc(e.player || '')}${e.other && !/own/i.test(e.detail) ? ` <span class="muted">(${esc(e.other)})</span>` : ''}${/own/i.test(e.detail) ? ' <span class="muted">own goal</span>' : /pen/i.test(e.detail) ? ' <span class="muted">penalty</span>' : ''}`;
      else if (e.type === 'Card') what = `<span class="${/red/i.test(e.detail) ? 'cardr' : 'cardy'}" aria-label="${esc(e.detail)}"></span> ${esc(e.player || '')}`;
      else what = `<span class="muted">Sub</span> ${esc(e.player || '')} on${e.other ? ' for ' + esc(e.other) : ''}`;
      return `<tr><td class="l">${t}</td><td class="l">${what}</td><td class="l muted">${esc(side)}</td></tr>`;
    };
    const timeline = evs.length ? `<div class="tbl-wrap"><table><tbody>${evs.map(evRow).join('')}</tbody></table></div>` : '<p class="small muted">No goals, cards or substitutions yet.</p>';
    const stamp = m.liveAt ? `Updated ${fmtTime(m.liveAt)}${done ? '' : ', refreshes every minute'}.` : '';
    return `<div class="panel"><div class="row"><h3 class="grow">${done ? 'Full time' : L.status === 'HT' ? 'Half time' : 'Live, ' + min + "'"}</h3><button class="chip" data-act="live-refresh">Refresh</button></div>
      <p class="small muted">${stamp} Expected is the pre-match prediction for the whole match.</p>${table}</div>${inplay}<div class="panel"><h3>Goals, cards and substitutions</h3>${timeline}</div>`;
  }
  function viewLivePlayers(r) {
    const m = state.match, L = m.live, f = r.fixture;
    if (!L) return m.liveErr ? `<div class="error">${esc(m.liveErr)}</div>` : progressBlock('Loading live data');
    if (!L.players) return `<div class="empty">Player stats appear here once the match starts.</div>`;
    const side = m.liveSide, tid = side === 'home' ? f.home.id : f.away.id;
    const seg = `<div class="seg" role="group"><button data-act="lside" data-v="home" aria-pressed="${side === 'home'}">${esc(f.home.name)}</button><button data-act="lside" data-v="away" aria-pressed="${side === 'away'}">${esc(f.away.name)}</button></div>`;
    const done = D.isFinished(L), min = liveMinute(L);
    const pre = new Map(r.players[side].map((p) => [p.id, p]));
    const ps = L.players.filter((p) => p.team === tid && p.min > 0).sort((a, b) => (b.start - a.start) || ('GDMF'.indexOf(FP.players.normPos(a.pos)) - 'GDMF'.indexOf(FP.players.normPos(b.pos))));
    const rows = ps.map((p) => {
      const P = pre.get(p.id);
      const left = !done && p.onPitch !== false ? Math.max(0, 90 - min) : 0;
      const next = (k, word) => {
        if (!P || !P.pred[k] || !P.pred[k].rate90) return '';
        const cur = p[k] || 0, lam = P.pred[k].rate90 * (P.pred[k].factor || 1) * left / 90;
        const out = [];
        for (const want of [cur + 1, cur + 2]) { if (want > 4 || done) continue; const pr = remainP(cur, lam, want); out.push(`<span class="pchip ${pr >= 0.5 ? 'mid' : ''}">${word} ${want}+ ${pct(pr)} <span class="odds">${esc(frac(fairDec(pr)))}</span></span>`); }
        return out.join('');
      };
      const gk = FP.players.normPos(p.pos) === 'G';
      const card = p.rc ? '<span class="cardr" aria-label="red card"></span>' : p.yc ? '<span class="cardy" aria-label="yellow card"></span>' : '';
      const stats = gk ? `<td colspan="4" class="l">${p.saves || 0} save${p.saves === 1 ? '' : 's'}</td>` : `<td>${p.fc || 0}</td><td>${p.fd || 0}</td><td>${p.shots || 0}</td><td>${p.sot || 0}${p.goals ? ` <span class="muted">(${p.goals}G)</span>` : ''}</td>`;
      const chips = !done && left > 0 && !gk ? `<tr class="nob"><td colspan="6"><div class="pchips">${next('fc', 'Fouls')}${next('fd', 'Fouled')}${next('sot', 'On target')}</div></td></tr>` : '';
      return `<tr><td class="l">${esc(p.name)} ${card}${p.onPitch === false && !done ? ' <span class="muted small">off</span>' : ''}</td><td>${p.min}'</td>${stats}</tr>${chips}`;
    }).join('');
    const hd = '<th class="l">Player</th><th>Min</th><th>Fouls</th><th>Fouled</th><th>Shots</th><th>On tgt</th>';
    return seg + `<div class="panel"><p class="small muted">${done ? 'Final player stats.' : `Live player stats, ${min}'. Chances show what each player still needs, using his pre-match rate for the minutes left.`} G marks goals.</p>
      <div class="tbl-wrap"><table class="live-pl"><thead><tr>${hd}</tr></thead><tbody>${rows || '<tr><td colspan="6" class="l">No players have appeared yet.</td></tr>'}</tbody></table></div></div>`;
  }

  /* ---------- match report ---------- */
  function viewReport(r) {
    const m = state.match, f = r.fixture;
    const status = D.isFinished(f) ? `<span class="badge warn">Finished ${f.goals ? f.goals.h + '-' + f.goals.a : ''}</span>` : r.lineupStatus === 'confirmed' ? '<span class="badge ok">Confirmed team sheets</span>' : '<span class="badge warn">Predicted line-ups</span>';
    const exp = r.team.goals;
    const head = `<section class="sheet-head"><div class="vs"><div class="side">${esc(f.home.name)}</div><div class="mid"><div class="big">${(() => { const L = m.live; if (L && L.goals && (D.isLive(L) || D.isFinished(L))) return L.goals.h + '–' + L.goals.a; return D.isFinished(f) && f.goals ? f.goals.h + '–' + f.goals.a : fmtTime(f.ts); })()}</div><div class="small">${f.hypothetical ? 'hypothetical' : m.live && D.isLive(m.live) ? (m.live.status === 'HT' ? 'Half time' : 'Live ' + (m.live.elapsed || '') + "'") : esc(fmtShort(f.ts))}</div></div><div class="side away">${esc(f.away.name)}</div></div>
      <div class="meta"><span>${esc(f.compName || '')}${f.round ? ', ' + esc(f.round) : ''}</span>${f.referee ? `<span>Referee ${esc(String(f.referee).split(',')[0])}</span>` : ''}<span>Expected goals ${f2(exp.lh)} to ${f2(exp.la)}</span></div>
      <div class="meta">${status}</div></section>`;
    const liveTabs = hasLive(r) ? [['live', D.isFinished(f) || (m.live && D.isFinished(m.live)) ? 'Match stats' : 'Live stats'], ['liveplayers', D.isFinished(f) || (m.live && D.isFinished(m.live)) ? 'Player stats' : 'Live players']] : [];
    const tabs = liveTabs.concat([['picks', 'Picks'], ['match', 'Match'], ['players', 'Players'], ['form', 'Form'], ['h2h', 'Head to head'], ['notes', 'Notes']]);
    const tabBar = `<div class="subtabs"><div class="chips" role="tablist">${tabs.map(([k, l]) => `<button class="chip" role="tab" data-act="rtab" data-v="${k}" aria-pressed="${m.tab === k}">${l}</button>`).join('')}</div></div>`;
    let body = '';
    if (m.tab === 'live') body = viewLiveTeam(r);
    else if (m.tab === 'liveplayers') body = viewLivePlayers(r);
    else if (m.tab === 'picks') body = viewPicks(r.selections, r, false);
    else if (m.tab === 'match') body = viewMatchNumbers(r);
    else if (m.tab === 'players') body = viewPlayers(r);
    else if (m.tab === 'form') body = viewForm(r);
    else if (m.tab === 'h2h') body = viewH2H(r);
    else body = viewNotes(r);
    return head + tabBar + body + '<p class="footer-note">Probabilities are model estimates from past data, not guarantees. Set limits and only stake what you can afford to lose.</p>';
  }

  function pickRow(mk, threshold, long, showMatch) {
    const odds = `<span>${priceText(mk)}</span>${mk.price && mk.edge != null ? `<span class="${mk.edge > 0 ? 'value' : 'novalue'}">${mk.edge > 0 ? 'Value +' + Math.round(mk.edge * 100) + '%' : 'Bookmaker implies ' + pct(mk.implied)}</span>` : ''}`;
    const res = mk.result === true ? '<span class="res-won">Won</span>' : mk.result === false ? '<span class="res-lost">Lost</span>' : '';
    const ctx = showMatch ? `<span>${esc(mk.match)}, ${fmtTime(mk.kickoff)}</span>` : '';
    const lu = mk.isPlayer && mk.lineup !== 'start' ? `<span>${mk.lineup === 'bench' ? 'on the bench' : 'line-up not confirmed'}</span>` : '';
    return `<div class="pick"><div class="top-line"><div class="lbl">${esc(mk.label)}</div><div class="prob">${pct(mk.p)}</div>${addBtn(legOf(mk))}</div>
      <div class="sub">${ctx}<span>${esc(mk.group)}</span>${lu}${odds}${res}</div>${strip(mk.p, threshold, long)}</div>`;
  }
  function viewPicks(sel, r, multi) {
    const st = state.settings;
    const list = multi ? state.day.tab : state.match.pickList;
    const act = multi ? 'dtab' : 'plist';
    const seg = `<div class="seg" role="group"><button data-act="${act}" data-v="best" aria-pressed="${list === 'best'}">Best bets</button><button data-act="${act}" data-v="long" aria-pressed="${list === 'long'}">Longshots</button><button data-act="${act}" data-v="lucky" aria-pressed="${list === 'lucky'}">Feeling lucky</button>${multi ? `<button data-act="${act}" data-v="matches" aria-pressed="${list === 'matches'}">Matches</button>` : ''}</div>`;
    const sortSeg = `<div class="row small" style="margin:-4px 0 10px"><span class="muted grow">Sort by</span><button class="chip" data-act="sort" data-v="prob" aria-pressed="${st.sort === 'prob'}">Probability</button><button class="chip" data-act="sort" data-v="value" aria-pressed="${st.sort === 'value'}">Value</button><button class="chip" data-act="copy">Copy</button></div>`;
    const groups = ['all', 'match', 'players'];
    const grpSeg = multi ? `<div class="chips">${groups.map((g) => `<button class="chip" data-act="dgroup" data-v="${g}" aria-pressed="${state.day.group === g}">${{ all: 'All markets', match: 'Match markets', players: 'Player markets' }[g]}</button>`).join('')}</div>` : '';
    const filt = (arr) => (!multi || state.day.group === 'all' ? arr : arr.filter((x) => (state.day.group === 'players' ? x.isPlayer : !x.isPlayer)));
    let body = '';
    if (list === 'matches' && multi) return seg + viewDayMatches(r);
    if (list === 'best') {
      const arr = filt(sel.best);
      body = arr.length ? `<div class="panel">${arr.map((x) => pickRow(x, st.best / 100, false, multi)).join('')}</div>` : `<div class="empty">Nothing reaches ${st.best}% here. Lower the Best bet threshold in Settings to see more.</div>`;
      body = `<p class="small muted">${st.best}% to ${st.cap}%. For each market only the most ambitious line that still clears ${st.best}% is shown.</p>` + body;
    } else if (list === 'long') {
      const arr = filt(sel.longshots);
      body = `<p class="small muted">${st.longMin}% to ${st.best - 1}%. Better prices, more risk.</p>` + (arr.length ? `<div class="panel">${arr.map((x) => pickRow(x, st.best / 100, true, multi)).join('')}</div>` : '<div class="empty">No longshots in this range.</div>');
    } else {
      const L = sel.lucky;
      if (!L) body = '<div class="empty">Not enough selections to build a combination.</div>';
      else {
        const nLong = L.legs.filter((x) => x.p < st.best / 100).length;
        body = `<div class="panel"><h3>Feeling lucky</h3><p class="small muted">${L.legs.length - nLong} best bets and ${nLong} longshot${nLong === 1 ? '' : 's'}, chosen so no two legs measure the same thing${multi ? ', one leg per match' : ''}.</p>${L.legs.map((x) => pickRow(x, st.best / 100, x.p < st.best / 100, multi)).join('')}
          <div class="lucky-total"><div><div>All legs win</div><div class="small muted">${L.sameMatch ? 'Same-match legs are linked, so treat this as approximate.' : 'Assumes the matches are independent.'}</div></div><div class="prob">${pct(L.p)}</div></div>
          ${L.price ? `<div class="row small" style="margin-top:6px"><span class="grow">Combined odds ${L.price.toFixed(2)}</span>${L.edge == null ? '' : `<span class="${L.edge > 0 ? 'value' : 'novalue'}">${L.edge > 0 ? 'Value +' + Math.round(L.edge * 100) + '%' : 'No value at these prices'}</span>`}</div>` : ''}</div>`;
      }
    }
    return seg + (list === 'lucky' ? '' : sortSeg) + grpSeg + body;
  }

  function cell(r, family, level, label, p) {
    const m = findMarket(r, family, level);
    const price = m && m.price ? `<span class="odds">${esc(frac(m.price))}</span>` : `<span class="odds fair">${esc(frac(fairDec(p)))}</span>`;
    return `<td><span class="cellp">${pct(p)}</span> ${price} ${addBtn(adHocLeg(r, family, level, label, p))}</td>`;
  }
  function lineTable(title, t, lines, opts) {
    opts = opts || {};
    const r = opts.r, stat = opts.stat, word = opts.word || title.toLowerCase();
    const rows = lines.map((l) => {
      const po = S.atLeast(t.total, Math.ceil(l));
      const fam = stat === 'goals' ? 'g-tot' : stat + '-tot';
      return r ? `<tr><td>${l}</td>${cell(r, fam + '-o', l, `Over ${l} ${word}`, po)}${cell(r, fam + '-u', -l, `Under ${l} ${word}`, 1 - po)}</tr>` : `<tr><td>Over ${l}</td><td>${pct(po)}</td><td>${pct(1 - po)}</td></tr>`;
    }).join('');
    return `<div class="panel"><h3>${esc(title)}</h3><p class="small muted">Expected ${f1(t.lh)} for the home side, ${f1(t.la)} for the away side, ${f1(t.lh + t.la)} in total.</p>
      <p class="small muted">Odds in grey are fair odds from the model's chance; odds in black are bookmaker prices. Tap + to add a line to the bet builder.</p>
      <div class="tbl-wrap"><table><thead><tr><th class="l">Line</th><th>Over</th><th>Under</th></tr></thead><tbody>${rows}</tbody></table></div>${opts.extra || ''}</div>`;
  }
  function teamLines(r, stat, lines, word) {
    const t = r.team[stat], f = r.fixture;
    const fam = stat === 'goals' ? 'g' : stat;
    const w = word.toLowerCase().replace(/^team |^saves by keeper$/, (x) => (x === 'saves by keeper' ? 'keeper saves' : ''));
    const rows = lines.map((l) => `<tr><td>${l}+</td>${cell(r, `${fam}-H-o`, l - 0.5, `${f.home.name} ${l}+ ${w}`, S.atLeast(t.home, l))}${cell(r, `${fam}-A-o`, l - 0.5, `${f.away.name} ${l}+ ${w}`, S.atLeast(t.away, l))}${cell(r, `${stat}-both`, l, `Both teams ${l}+ ${w}`, S.bothAtLeast(t.joint, l))}</tr>`).join('');
    return `<div class="tbl-wrap"><table><thead><tr><th class="l">${esc(word)}</th><th>${esc(f.home.name)}</th><th>${esc(f.away.name)}</th><th>Both</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function viewMatchNumbers(r) {
    const g = r.team.goals, f = r.fixture;
    const x = g.oneXtwo;
    const bar = `<div class="bar1x2" role="img" aria-label="Home ${pct(x.h)}, draw ${pct(x.d)}, away ${pct(x.a)}"><div class="h" style="width:${x.h * 100}%">${pct(x.h)}</div><div class="d" style="width:${x.d * 100}%">${pct(x.d)}</div><div class="a" style="width:${x.a * 100}%">${pct(x.a)}</div></div>`;
    const res = `<div class="panel"><h3>Result</h3><div class="row small muted" style="margin:6px 0"><span class="grow">${esc(f.home.name)}</span><span>Draw</span><span class="grow" style="text-align:right">${esc(f.away.name)}</span></div>${bar}
      <div class="tbl-wrap" style="margin-top:12px"><table><tbody>
        <tr><td>${esc(f.home.name)} to win</td>${cell(r, 'res-H', 0, `${f.home.name} to win`, x.h)}</tr>
        <tr><td>Draw</td>${cell(r, 'res-D', 0, 'Draw', x.d)}</tr>
        <tr><td>${esc(f.away.name)} to win</td>${cell(r, 'res-A', 0, `${f.away.name} to win`, x.a)}</tr>
        <tr><td>${esc(f.home.name)} or draw</td>${cell(r, 'dc-1X', 0, `${f.home.name} or draw (double chance)`, x.h + x.d)}</tr>
        <tr><td>${esc(f.away.name)} or draw</td>${cell(r, 'dc-X2', 0, `${f.away.name} or draw (double chance)`, x.a + x.d)}</tr>
        <tr><td>Both teams to score</td>${cell(r, 'btts-y', 0, 'Both teams to score', g.btts)}</tr>
        <tr><td>Both teams to score: No</td>${cell(r, 'btts-n', 0, 'Both teams to score: No', 1 - g.btts)}</tr></tbody></table></div>
      <div class="hits" style="margin-top:12px">
      ${g.topScores.slice(0, 4).map((s) => `<span class="hit">Score ${s.s} <b>${pct(s.p)}</b></span>`).join('')}</div></div>`;
    const fac = r.factors;
    const facLine = (st, word) => {
      const a = [];
      if (fac[st].referee) a.push(`referee ${fac[st].referee.factor >= 1 ? '+' : ''}${Math.round((fac[st].referee.factor - 1) * 100)}% from ${fac[st].referee.n} games`);
      if (fac[st].h2h) a.push(`head to head ${fac[st].h2h.factor >= 1 ? '+' : ''}${Math.round((fac[st].h2h.factor - 1) * 100)}% from ${fac[st].h2h.n} meetings`);
      return a.length ? `<p class="small muted">${esc(word)} adjusted for ${a.join(' and ')}.</p>` : '';
    };
    return res + lineTable('Goals', g, [0.5, 1.5, 2.5, 3.5, 4.5], { r, stat: 'goals', word: 'goals', extra: teamLines(r, 'goals', [1, 2, 3], 'Team goals') })
      + lineTable('Corners', r.team.corners, [7.5, 8.5, 9.5, 10.5, 11.5, 12.5], { r, stat: 'corners', word: 'corners', extra: teamLines(r, 'corners', [3, 4, 5, 6, 7], 'Team corners') + facLine('corners', 'Corners') })
      + lineTable('Cards', r.team.cards, [1.5, 2.5, 3.5, 4.5, 5.5, 6.5], { r, stat: 'cards', word: 'cards', extra: teamLines(r, 'cards', [1, 2, 3, 4], 'Team cards') + facLine('cards', 'Cards') + '<p class="small muted">Cards count yellows plus reds as recorded by the data source. Bookmakers settle card markets in different ways, so check their rules.</p>' })
      + lineTable('Goalkeeper saves', r.team.saves, [3.5, 4.5, 5.5, 6.5, 7.5], { r, stat: 'saves', word: 'keeper saves', extra: teamLines(r, 'saves', [1, 2, 3, 4, 5], 'Saves by keeper') })
      + lineTable('Shots on target', r.team.sot, [5.5, 6.5, 7.5, 8.5, 9.5, 10.5], { r, stat: 'sot', word: 'shots on target', extra: teamLines(r, 'sot', [2, 3, 4, 5, 6], 'Team shots on target') })
      + lineTable('Shots', r.team.shots, [18.5, 20.5, 22.5, 24.5, 26.5], { r, stat: 'shots', word: 'shots', extra: teamLines(r, 'shots', [8, 10, 12, 14], 'Team shots') })
      + lineTable('Fouls', r.team.fouls, [18.5, 20.5, 22.5, 24.5, 26.5], { r, stat: 'fouls', word: 'fouls', extra: teamLines(r, 'fouls', [8, 10, 12, 14], 'Team fouls') + facLine('fouls', 'Fouls') });
  }

  function statusLabel(p) {
    if (p.status === 'start') return '<span class="st start">Starting</span>';
    if (p.status === 'bench') return '<span class="st bench">Substitute</span>';
    if (p.status === 'out') return `<span class="st out">Out${p.injury ? ': ' + esc(p.injury.reason) : ''}</span>`;
    if (p.status === 'doubt') return `<span class="st doubt">Doubtful${p.injury ? ': ' + esc(p.injury.reason) : ''}, plays ${pct(p.pPlay)}</span>`;

  function playerDetail(p) {
