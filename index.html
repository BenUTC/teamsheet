  function howItWorks() {
    return `<div class="panel"><details><summary>How the predictions work</summary><div class="small">
      <p><b>Team numbers.</b> For goals, corners, cards, fouls, shots, shots on target and keeper saves, each team gets an attacking and a defending strength, fitted to every completed league match this season and last, with recent matches counting more. Goals blend real goals with expected goals. Cards and fouls are adjusted for the referee when the data source names one, and cards, fouls and corners slightly for head-to-head history.</p>
      <p><b>Player numbers.</b> Each player's rate per 90 minutes is shrunk towards the average for his position until he has enough minutes to stand on his own, then scaled by the matchup (for example, opponents who concede many fouls raise a player's chance of being fouled) and by his expected minutes. With confirmed team sheets only those players are used. Before then, starting chances come from recent line-ups (and injury news, where the data source has it).</p>
      <p><b>Tested on real matches.</b> Walk-forward tests on 9,130 Premier League, La Liga, Bundesliga, Serie A and Ligue 1 matches (2021 to 2026) beat league averages on every market and were well calibrated: when the model said 70%, it happened about 70% of the time. Player models were tested on 1,500 matches of player-level data with the same result. The finished app was then run on seven real match days in October and November 2026 using only data from before each kick-off: 240 best bets were expected to win 89% of the time and won 90%; 180 longshots were expected to win 75% and won 76%. Cards are the hardest market to predict.</p>
      <p><b>Against the bookmakers.</b> On 1,752 matches from last season, bookmaker prices predicted match results and over/under 2.5 goals better than the model, and the model's apparent value bets on those markets lost money. So when prices are available, goal and result chances are anchored to them, which improved accuracy on this season's matches. Corners, cards, shots, saves, fouls and player numbers come from the models alone; there were no prices to test them against.</p>
      <p><b>What this cannot do.</b> No model knows team talk, motivation or weather, and a 75% pick still loses one time in four. A high probability is not the same as a good bet: picks at 85% or more usually come with very short prices.</p>
      <p>Help with gambling: <a href="https://www.begambleaware.org" rel="noopener">BeGambleAware</a>, National Gambling Helpline 0808 8020 133.</p></div></details></div>`;
  }


  /* ---------- storage management ---------- */
  const storageState = { info: null, busy: false, armed: null };
  function fmtMB(bytes) { return bytes == null ? '–' : bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / 1048576).toFixed(1) + ' MB'; }
  function storageBody() {
    if (state.settings.source === 'demo') return '<p class="small muted">Demo mode keeps nothing on the phone.</p>';
    const i = storageState.info;
    if (!i) { if (!storageState.busy) setTimeout(refreshStorage, 0); return '<p class="small muted">Checking what is saved…</p>'; }
    const seasons = Object.entries(i.bySeason).sort((a, b) => b[0] - a[0]).map(([y, n]) => `${y}/${String(+y + 1).slice(2)}: ${n.toLocaleString('en-GB')} matches`).join(', ');
    const arm = (k, label, armedLabel) => `<button class="btn ${k === 'all' ? '' : 'secondary'} wide" style="margin-top:8px${k === 'all' && storageState.armed === 'all' ? ';background:var(--red)' : ''}" data-act="storage" data-v="${k}" ${storageState.busy ? 'disabled' : ''}>${storageState.armed === k ? armedLabel : label}</button>`;
    return `<p>${i.matches.toLocaleString('en-GB')} finished matches saved${i.usage != null ? `, using about ${fmtMB(i.usage)}` : ''}${i.quota ? ` of the ${fmtMB(i.quota)} Chrome allows this app` : ''}.</p>
      ${seasons ? `<p class="small muted">${esc(seasons)}</p>` : ''}
      <p class="small muted">Saved matches stop the app downloading them again. What is kept on the phone is far smaller than what is downloaded: each match takes up only a few KB. Matches more than two seasons old are removed automatically.</p>
      ${arm('old', 'Remove older seasons (keep this season)', 'Tap again to remove older seasons')}
      ${arm('all', 'Clear everything saved', 'Tap again to clear everything')}
      ${state.settings.includePrevSeason && i.matches ? '<p class="small muted">With "Use last season as well" switched on, last season is downloaded again next time it is needed. Switch it off under Picks to keep storage and downloads lower, at some cost to accuracy.</p>' : ''}`;
  }
  async function refreshStorage() {
    storageState.busy = true;
    try {
      const e = await getEngine();
      const st = e.client.store;
      const keys = await st.keys('fx:');
      const recs = await st.getMany(keys);
      const bySeason = {};
      for (const f of recs) if (f && f.season != null) bySeason[f.season] = (bySeason[f.season] || 0) + 1;
      let usage = null, quota = null;
      try { if (navigator.storage && navigator.storage.estimate) { const est = await navigator.storage.estimate(); usage = est.usage; quota = est.quota; } } catch (err) { /* not available */ }
      storageState.info = { matches: keys.length, bySeason, usage, quota };
    } catch (err) { storageState.info = { matches: 0, bySeason: {}, usage: null, quota: null }; }
    storageState.busy = false;
    const el = document.getElementById('storage-panel');
    if (el) el.innerHTML = '<h2>Storage on this phone</h2>' + storageBody();
  }
  /* remove saved matches: mode 'old' keeps each competition's latest season, 'all' clears the store, 'auto' drops matches over two seasons old */
  async function pruneStorage(mode) {
    const e = await getEngine();
    const st = e.client.store;
    if (mode === 'all') { await st.clear(); return; }
    const keys = await st.keys('fx:');
    const recs = await st.getMany(keys);
    const latest = {};
    for (const f of recs) if (f) latest[f.comp] = Math.max(latest[f.comp] || 0, f.season || 0);
    const cutoff = Date.now() - 700 * 86400000;
    const drop = [];
    keys.forEach((k, i) => {
      const f = recs[i];
      if (!f) return;
      if (mode === 'old' && f.season < latest[f.comp]) drop.push(k);
      if (mode === 'auto' && f.ts < cutoff) drop.push(k);
    });
    if (mode === 'old') drop.push(...(await st.keys('api:fixtures?league=')));
    if (st.delMany) await st.delMany(drop); else for (const k of drop) await st.del(k);
    return drop.length;
  }


  /* ---------- bet tracker ---------- */
  const pctPlain = (p) => (p == null || !isFinite(p) ? '–' : Math.round(p * 100) + '%');
  const money = (x) => (x == null || !isFinite(x) ? '–' : (x < 0 ? '-£' : '£') + Math.abs(x).toFixed(2));
  function saveBets() { if (!FP.tracker.save(state.bets)) toast('Could not save: browser storage is full or blocked'); }
  function periodStart(k) {
    const now = new Date();
    if (k === 'month') return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
    if (k === 'week') return Date.now() - 7 * 86400000;
    return 0;
  }
  let settling = false;
  async function autoSettle() {
    if (settling) return;
    const src = state.settings.source;
    const mine = state.bets.filter((b) => (b.source || 'espn') === src);
    const ids = FP.tracker.pendingFixtures(mine, Date.now()).slice(0, 30);
    if (!ids.length) return;
    settling = true; state.betsUi.busy = true; if (state.view === 'bets') render();
    const map = new Map();
    try {
      const e = await getEngine();
      for (const id of ids) { try { map.set(id, await e.liveUpdate(id)); } catch (err) { /* try again next time */ } }
      const n = FP.tracker.applyResults(mine, map);
      if (n) { saveBets(); state.betsUi.msg = 'Results updated'; }
    } catch (err) { state.betsUi.msg = friendlyError(err); }
    settling = false; state.betsUi.busy = false;
    if (state.view === 'bets' && !state.slipOpen) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  }
  const STATUS = { open: 'Open', won: 'Won', lost: 'Lost', void: 'Void', check: 'Check: a leg was void' };
  function betCard(b) {
    const ui = state.betsUi;
    const pAll = b.legs.reduce((a, l) => a * l.p, 1);
    const legs = b.legs.map((l) => {
      const ic = l.result === true ? '<span class="res-won">✓</span>' : l.result === false ? '<span class="res-lost">✗</span>' : l.result === 'void' ? '<span class="muted">void</span>' : '<span class="muted">…</span>';
      return `<div class="betleg">${ic} <span class="grow">${esc(l.label)}<br><span class="small muted">${esc(l.match)}${l.kickoff ? ', ' + fmtShort(l.kickoff) : ''}, model ${pct(l.p)}${l.odds ? ', ' + esc(frac(l.odds)) : ''}</span></span></div>`;
    }).join('');
    const ret = b.status === 'open' ? `Returns ${money(b.stake * b.odds)} if it wins` : b.status === 'check' ? 'A leg was void; check the return with your bookmaker and mark it below' : `Returned ${money(b.returns)} (${b.returns - b.stake >= 0 ? '+' : ''}${money(b.returns - b.stake)})`;
    const arm = (v, label) => `<button class="chip" data-act="bet-mark" data-id="${b.id}" data-v="${v}">${ui.armed === b.id + v ? 'Tap again' : label}</button>`;
    return `<div class="panel bet ${b.status}"><div class="row"><span class="badge ${b.status === 'won' ? 'ok' : b.status === 'lost' ? 'bad' : 'warn'}">${STATUS[b.status] || b.status}${b.manual ? ' (set by you)' : ''}</span><span class="grow small muted">${new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: TZ }).format(b.placedAt)}${b.book ? ', ' + esc(b.book) : ''}</span></div>
      <div class="row" style="margin:8px 0"><span class="grow"><b>${money(b.stake)}</b> at <b>${esc(frac(b.odds))}</b> (${b.odds.toFixed(2)})</span><span class="small muted">Model ${pct(pAll)}, value ${b.odds * pAll - 1 >= 0 ? '+' : ''}${Math.round((b.odds * pAll - 1) * 100)}%</span></div>
      ${legs}<p class="small">${ret}</p>
      <div class="chips" style="flex-wrap:wrap">${arm('won', 'Mark won')}${arm('lost', 'Mark lost')}${arm('void', 'Mark void')}${b.manual ? arm('auto', 'Settle automatically') : ''}${arm('delete', 'Delete')}</div></div>`;
  }
  function viewBets() {
    const ui = state.betsUi, T = FP.tracker;
    const since = periodStart(ui.period);
    const bets = state.bets;
    const s = T.summary(bets, since), c = T.calibration(bets, since);
    const per = [['all', 'All time'], ['month', 'This month'], ['week', 'Last 7 days']].map(([k, l]) => `<button class="chip" data-act="bets-period" data-v="${k}" aria-pressed="${ui.period === k}">${l}</button>`).join('');
    if (!bets.length) return `<div class="panel"><h2>Your bets</h2><p>No bets logged yet.</p><p class="small muted">Add selections to the bet builder, open it, and use <b>Log this bet</b> once you have placed it with your bookmaker. The app settles each bet from the result and tracks your profit and loss, and how often the model's chances come in.</p></div>${backupPanel()}`;
    const head = `<div class="panel"><h2>Your bets</h2><div class="chips">${per}</div>
      <div class="kpis"><div><span class="small muted">Profit</span><b class="${s.profit >= 0 ? 'value' : 'res-lost'}">${money(s.profit)}</b></div><div><span class="small muted">Return on stakes</span><b>${s.roi == null ? '–' : (s.roi >= 0 ? '+' : '') + Math.round(s.roi * 100) + '%'}</b></div><div><span class="small muted">Won</span><b>${s.won} of ${s.won + s.lost}</b></div></div>
      <p class="small muted">Settled: ${money(s.staked)} staked, ${money(s.returned)} returned${s.void ? `, ${s.void} void` : ''}. Open: ${s.open} bet${s.open === 1 ? '' : 's'}, ${money(s.openStake)} staked.${ui.busy ? ' Checking results…' : ''}</p>
      <button class="chip" data-act="bets-refresh" ${ui.busy ? 'disabled' : ''}>Check results now</button></div>`;
    const cal = c.n ? `<div class="panel"><h3>How the model's chances held up</h3><p class="small muted">Every settled selection you bet on, grouped by the chance the app gave it. If the model is right, the two columns should be close once you have plenty of bets.</p>
      <div class="tbl-wrap"><table><thead><tr><th class="l">Model chance</th><th>Selections</th><th>Expected to win</th><th>Won</th></tr></thead><tbody>
      ${c.bands.map((b) => `<tr><td class="l">${b.lo === 0 ? 'Under 50%' : Math.round(b.lo * 100) + '% to ' + Math.min(100, Math.round(b.hi * 100)) + '%'}</td><td>${b.n}</td><td>${pctPlain(b.p / b.n)}</td><td><b>${pctPlain(b.won / b.n)}</b></td></tr>`).join('')}
      <tr><td class="l"><b>All</b></td><td><b>${c.n}</b></td><td><b>${pctPlain(c.expected)}</b></td><td><b>${pctPlain(c.actual)}</b></td></tr></tbody></table></div>
      ${c.groups.length > 1 ? `<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th class="l">Market</th><th>Selections</th><th>Expected</th><th>Won</th></tr></thead><tbody>${c.groups.map((g) => `<tr><td class="l">${esc(g.g)}</td><td>${g.n}</td><td>${pctPlain(g.p / g.n)}</td><td>${pctPlain(g.won / g.n)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${c.avgValue != null ? `<p class="small muted">Average value at the odds you took: ${c.avgValue >= 0 ? '+' : ''}${Math.round(c.avgValue * 100)}% per selection.</p>` : ''}
      ${c.n < 50 ? '<p class="small muted">Fewer than 50 settled selections: too few to judge the model yet.</p>' : ''}</div>` : '';
    const inP = bets.filter((b) => b.placedAt >= since);
    const open = inP.filter((b) => b.status === 'open' || b.status === 'check');
    const done = inP.filter((b) => !(b.status === 'open' || b.status === 'check'));
    const list = (open.length ? `<h3 style="margin:14px 2px 8px">Open bets</h3>${open.map(betCard).join('')}` : '')
      + (done.length ? `<h3 style="margin:14px 2px 8px">Settled bets</h3>${done.slice(0, ui.show).map(betCard).join('')}${done.length > ui.show ? `<button class="btn secondary wide" data-act="bets-more">Show more</button>` : ''}` : '');
    return head + cal + list + backupPanel();
  }
  function backupPanel() {
    return `<div class="panel"><h3>Backup</h3><p class="small muted">Bets are kept only in this browser on this phone. Clearing saved match data does not touch them, but clearing Chrome's site data does, so take a backup now and then.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn secondary" data-act="bets-backup">Copy backup</button><button class="btn secondary" data-act="bets-csv">Download spreadsheet (CSV)</button></div>
      <label class="field" for="restore">Restore from a backup</label><textarea id="restore" rows="3" placeholder="Paste a backup here" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px"></textarea>
      <button class="btn secondary" data-act="bets-restore" style="margin-top:8px">Restore</button></div>`;
  }

  /* ---------- picks copy ---------- */
  function picksText(sel, which, multi) {
    const arr = which === 'best' ? sel.best : which === 'long' ? sel.longshots : sel.lucky ? sel.lucky.legs : [];
    const lines = arr.map((m) => `${pct(m.p)}  ${m.label}${multi ? ' (' + m.match + ')' : ''}${m.price ? '  @' + m.price.toFixed(2) : ''}`);
    if (which === 'lucky' && sel.lucky) lines.push(`All legs: ${pct(sel.lucky.p)}${sel.lucky.price ? ', odds ' + sel.lucky.price.toFixed(2) : ''}`);
    return lines.join('\n');
  }

  /* ---------- events ---------- */
  async function onClick(ev) {
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
    const m = state.match, d = state.day, s = state.settings;
    switch (act) {
      case 'league': m.league = +id; m.list = null; m.teams = null; m.home = ''; m.away = ''; m.error = null; render(); break;
      case 'mode': m.mode = v; m.error = null; render(); break;
      case 'analyse': state.view = 'match'; runAnalysis((e, p) => e.analyseFixture(+id, p)); break;
      case 'analyse-teams': runAnalysis((e, p) => e.analyseTeams(m.league, +m.home, +m.away, p)); break;
      case 'back': clearTimeout(liveTimer); m.report = null; m.live = null; render(); if (m.list && m.list.some((x) => D.isLive(x))) { m.list = null; render(); } break;
      case 'rtab': m.tab = v; render(); if ((v === 'live' || v === 'liveplayers') && (!m.live || Date.now() - (m.liveAt || 0) > 55000)) refreshLive(); break;
      case 'lside': m.liveSide = v; render(); break;
      case 'live-refresh': refreshLive(); break;
      case 'add': { const leg = addReg.get(b.dataset.k); if (!leg) break; const added = toggleLeg(leg); toast(added ? 'Added to bet builder' : 'Removed from bet builder'); const y = window.scrollY; render(); window.scrollTo(0, y); break; }
      case 'log-bet': {
        const stake = parseFloat(($('#log-stake') || {}).value);
        const odds = parseOdds(($('#log-odds') || {}).value);
        const book = (($('#log-book') || {}).value || '').trim();
        const keep = !!($('#log-keep') || {}).checked;
        if (!(stake > 0)) { toast('Enter your stake'); break; }
        if (!odds) { toast('Enter the odds you got, for example 9/2'); break; }
        const bet = FP.tracker.createBet(state.slip, stake, odds, book, parseOdds);
        bet.source = state.settings.source;
        state.bets.unshift(bet); saveBets();
        if (book) { state.settings.lastBook = book; saveSettings(); }
        state.betsUi.keep = keep;
        if (!keep) { state.slip = []; saveSlip(); }
        state.slipOpen = false; toast('Bet logged'); location.hash = 'bets'; render();
        break;
      }
      case 'bets-period': state.betsUi.period = v; render(); break;
      case 'bets-more': state.betsUi.show += 20; render(); break;
      case 'bets-refresh': autoSettle(); break;
      case 'bet-mark': {
        const key = id + v, ui = state.betsUi;
        if (ui.armed !== key) { ui.armed = key; render(); setTimeout(() => { if (ui.armed === key) { ui.armed = null; if (state.view === 'bets') render(); } }, 4000); break; }
        ui.armed = null;
        const i = state.bets.findIndex((x) => x.id === id);
        if (i < 0) break;
        if (v === 'delete') state.bets.splice(i, 1); else FP.tracker.setManual(state.bets[i], v);
        saveBets(); if (v === 'auto') autoSettle();
        const y = window.scrollY; render(); window.scrollTo(0, y);
        break;
      }
      case 'bets-backup': {
        try { await navigator.clipboard.writeText(JSON.stringify({ app: 'teamsheet', saved: new Date().toISOString(), bets: state.bets })); toast('Backup copied. Paste it somewhere safe, such as a note or an email to yourself'); } catch (e) { toast('Copying is blocked here'); }
        break;
      }
      case 'bets-csv': {
        const csv = FP.tracker.toCSV(state.bets);
        if (IN_CLAUDE) { try { await navigator.clipboard.writeText(csv); toast('Downloads are blocked in this preview; spreadsheet copied instead'); } catch (e) { toast('Download is blocked here'); } break; }
        try {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
          a.download = 'teamsheet-bets.csv'; document.body.appendChild(a); a.click(); a.remove();
          toast('Spreadsheet downloaded');
        } catch (e) { try { await navigator.clipboard.writeText(csv); toast('Download blocked; spreadsheet copied instead'); } catch (e2) { toast('Download is blocked here'); } }
        break;
      }
      case 'bets-restore': {
        const txt = ($('#restore') || {}).value || '';
        try { const n = FP.tracker.importJSON(txt, state.bets); saveBets(); toast(n ? `Restored ${n} bet${n === 1 ? '' : 's'}` : 'Nothing new in that backup'); render(); } catch (e) { toast(e.message.includes('Teamsheet') ? e.message : 'That backup could not be read'); }
        break;
      }
      case 'slip-open': state.slipOpen = true; render(); window.scrollTo(0, 0); break;
      case 'slip-close': state.slipOpen = false; render(); break;
      case 'slip-remove': state.slip.splice(+b.dataset.i, 1); saveSlip(); render(); break;
      case 'slip-clear': state.slip = []; saveSlip(); render(); break;
      case 'slip-copy': {
        const t = slipTotals();
        const txt = state.slip.map((l) => `${l.label} (${l.match}) ${pct(l.p)}${l.odds ? ' @ ' + l.odds : ''}`).join('\n') + `\nAll legs: ${pct(t.p)}, fair odds ${frac(t.fairDec)}${t.dec ? ', your odds ' + frac(t.dec) : ''}`;
        try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch (e) { toast('Copying is blocked here'); }
        break;
      }
      case 'plist': m.pickList = v; render(); break;
      case 'dtab': d.tab = v; render(); break;
      case 'dgroup': d.group = v; render(); break;
      case 'side': m.side = v; m.open = new Set(); render(); break;
      case 'ptoggle': { const k = isNaN(+id) ? id : +id; if (m.open.has(k)) m.open.delete(k); else m.open.add(k); render(); break; }
      case 'sort': s.sort = v; saveSettings(); resort(); render(); break;
      case 'copy': {
        const multi = state.view === 'day';
        const rep = multi ? d.report : m.report;
        const which = multi ? d.tab : m.pickList;
        try { await navigator.clipboard.writeText(picksText(rep.selections, which, multi)); toast('Copied'); } catch (e) { toast('Copying is blocked here'); }

      case 'showkey': { const k = $('#key'); if (k) k.type = k.type === 'password' ? 'text' : 'password'; break; }

          const e = await getEngine();

          if (!s.customLeagues.some((c) => c.id === val)) s.customLeagues.push({ id: val, name: info.name });
          if (!s.leagues.includes(val)) s.leagues.push(val);

        } catch (err) { toast(friendlyError(err)); }

      }
      case 'storage': {
        if (storageState.armed !== v) { storageState.armed = v; const el = document.getElementById('storage-panel'); if (el) el.innerHTML = '<h2>Storage on this phone</h2>' + storageBody(); setTimeout(() => { if (storageState.armed === v) { storageState.armed = null; const el2 = document.getElementById('storage-panel'); if (el2) el2.innerHTML = '<h2>Storage on this phone</h2>' + storageBody(); } }, 5000); break; }
        storageState.armed = null; storageState.busy = true;
        try {
          const n = await pruneStorage(v);
          engine = null; resetReports();
          toast(v === 'all' ? 'Everything saved has been cleared' : `Removed ${n} older matches`);
        } catch (err) { toast('Could not clear: ' + err.message); }
        storageState.info = null; storageState.busy = false;
        if (state.view === 'settings') render(); else refreshStorage();
        break;
      }
      default: break;
    }
  }
  function resort() {
    for (const rep of [state.match.report, state.day.report]) {
      if (!rep) continue;
      const rules = rulesOf(state.settings);
      rep.selections = FP.markets.select(rep.markets, rules, { sort: state.settings.sort, multiMatch: rep.kind === 'day', maxBest: rep.kind === 'day' ? 40 : undefined, maxLong: rep.kind === 'day' ? 30 : undefined });
    }
  }
  function onChange(ev) {
    const el = ev.target, bind = el.dataset && el.dataset.bind;
    if (!bind) return;
    const s = state.settings;
    if (bind === 'legOdds') { const l = state.slip[+el.dataset.i]; if (l) { l.odds = el.value.trim(); saveSlip(); render(); } return; }
    if (bind === 'home' || bind === 'away') { state.match[bind] = el.value; render(); return; }
    if (bind === 'date') { state.day.date = el.value; return; }
    if (bind === 'leagueToggle') { const id = +el.value; if (el.checked) { if (!s.leagues.includes(id)) s.leagues.push(id); } else s.leagues = s.leagues.filter((x) => x !== id); state.day.leagues = null; saveSettings(); return; }
    if (bind === 'source') { s.source = el.value; resetData(); saveSettings(); render(); if (s.source === 'apifootball' && s.apiKey) refreshStatus(); return; }
    if (bind === 'apiKey') { s.apiKey = el.value.trim(); resetData(); saveSettings(); return; }
    if (bind === 'keyType') { s.keyType = el.value; resetData(); saveSettings(); return; }
    if (bind === 'best' || bind === 'longMin') { s[bind] = +el.value; if (s.longMin >= s.best) s.longMin = s.best - 5; saveSettings(); resort(); return; }
    if (bind === 'luckyLong' || bind === 'minOdds' || bind === 'cap') { s[bind] = +el.value; saveSettings(); resort(); return; }
    if (bind === 'includePlayers' || bind === 'includePrevSeason') { s[bind] = el.checked; saveSettings(); resort(); return; }
    if (bind === 'prefBook') { s.prefBook = el.value.trim() || 'Bet365'; saveSettings(); return; }
  }
  function onInput(ev) {
    const el = ev.target;
    if (el.id === 'best') $('#best-v').textContent = el.value;
    if (el.id === 'longmin') $('#long-v').textContent = el.value;
  }
  function resetReports() { Object.assign(state.match, { list: null, teams: null, report: null }); Object.assign(state.day, { report: null }); }
  function resetData() {
    storageState.info = null;
    engine = null; state.status = null; state.statusErr = null;
    Object.assign(state.match, { league: null, list: null, teams: null, report: null, error: null });
    Object.assign(state.day, { report: null, leagues: null, error: null });
  }
  function route() {
    const h = (location.hash || '#match').slice(1);
    state.view = ['match', 'day', 'bets', 'settings'].includes(h) ? h : 'match';
    if (state.view === 'bets') setTimeout(autoSettle, 0);
    state.slipOpen = false;
    if (state.view === 'settings') storageState.info = null;
    render();
  }

  let listTimer = null;
  function scheduleListRefresh() {
    clearTimeout(listTimer);
    listTimer = setTimeout(() => {
      const m = state.match;
      if (state.view === 'match' && !m.report && !state.slipOpen && m.mode === 'fixtures' && m.list && m.list.some((x) => D.isLive(x) || (x.status === 'NS' && x.ts < Date.now()))) loadFixtures();
      scheduleListRefresh();
    }, 60000);
  }
  function start() {
    state.slip = loadSlip();
    state.bets = FP.tracker.load();
    setTimeout(autoSettle, 5000);
    scheduleListRefresh();
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    window.addEventListener('hashchange', route);
    route();
    if (state.settings.source === 'apifootball' && state.settings.apiKey) refreshStatus();
    if (state.settings.source !== 'demo') {
      let last = 0; try { last = +localStorage.getItem('teamsheet.pruned') || 0; } catch (e) { /* ignore */ }
      if (Date.now() - last > 86400000) setTimeout(() => pruneStorage('auto').then(() => { try { localStorage.setItem('teamsheet.pruned', String(Date.now())); } catch (e) { /* ignore */ } }).catch(() => {}), 3000);
    }
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
      try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* not available */ }
    }
  }

  FP.ui = { start, state, pct, render };
})(typeof globalThis !== 'undefined' ? globalThis : this);

FP.ui.start();
